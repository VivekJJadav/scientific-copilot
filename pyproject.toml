[project]
name = "scientific-copilot"
version = "0.1.0"
description = "Research agent system for ArXiv papers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "sqlmodel>=0.0.18",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "arxiv>=2.1.0",
    "rapidfuzz>=3.9.3",
    "sentence-transformers>=3.0.1",
    "structlog>=24.2.0",
    "pydantic-settings>=2.3.4",
    "pgvector>=0.2.5",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "greenlet>=3.3.2",
    "ollama>=0.4.0",
    "groq>=0.9.0",
    "langchain-core>=0.2.0",
    "langgraph>=1.1.3",
    "docker>=7.1.0",
    "wandb>=0.25.1",
    "mlflow>=3.10.1",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7"
]
